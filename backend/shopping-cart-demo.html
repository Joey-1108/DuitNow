<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - DuitNow QR Auto Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }
        
        .cart-item:hover {
            background: #f8f9fa;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .item-price {
            color: #666;
            font-size: 14px;
        }
        
        .item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 8px;
        }
        
        .qty-btn {
            background: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .qty-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .qty {
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        
        .item-total {
            font-weight: 700;
            color: #667eea;
            font-size: 16px;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 16px;
        }
        
        .summary-row.total {
            border-top: 2px solid #ddd;
            margin-top: 10px;
            padding-top: 15px;
            font-size: 20px;
            font-weight: 700;
            color: #28a745;
        }
        
        .pay-button {
            width: 100%;
            padding: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .pay-button:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .payment-screen {
            display: none;
        }
        
        .payment-screen.active {
            display: block;
        }
        
        .cart-screen.hidden {
            display: none;
        }
        
        .qr-container {
            text-align: center;
            margin: 30px 0;
        }
        
        #qrImage {
            max-width: 280px;
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 10px;
            background: white;
            margin: 0 auto;
            display: block;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }
        
        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.paid {
            background: #d4edda;
            color: #155724;
        }
        
        .order-summary {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .order-summary h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #555;
        }
        
        .simulate-btn {
            background: #667eea;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .simulate-btn:hover {
            background: #5568d3;
        }
        
        .back-btn {
            background: #6c757d;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Shopping Cart Screen -->
        <div class="cart-screen" id="cartScreen">
            <h1>🛒 Shopping Cart</h1>
            <p class="subtitle">Automatic QR generation with cart total</p>
            
            <div id="cartItems"></div>
            
            <div class="summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">RM 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Service Tax (6%):</span>
                    <span id="tax">RM 0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">RM 0.00</span>
                </div>
            </div>
            
            <button class="pay-button" onclick="proceedToPayment()">
                <span>💳</span>
                <span>Pay Now with DuitNow QR</span>
            </button>
        </div>
        
        <!-- Payment Screen -->
        <div class="payment-screen" id="paymentScreen">
            <h1>DuitNow QR Payment</h1>
            <p class="subtitle">Scan to complete payment</p>
            
            <div class="order-summary" id="orderSummary"></div>
            
            <div class="loader" id="loader"></div>
            
            <div class="qr-container" id="qrContainer" style="display: none;">
                <img id="qrImage" src="" alt="QR Code">
            </div>
            
            <div style="text-align: center; margin: 20px 0;">
                <div style="color: #666; margin-bottom: 5px;">Amount to Pay</div>
                <div id="paymentAmount" style="font-size: 32px; font-weight: bold; color: #28a745;">RM 0.00</div>
                <div style="color: #999; font-size: 12px; margin-top: 5px;">Order: <span id="orderId">-</span></div>
            </div>
            
            <div class="status" id="status" style="display: none;"></div>
            
            <button class="simulate-btn" id="simulateBtn" style="display: none;" onclick="simulatePayment()">
                💳 Simulate Payment (Test)
            </button>
            
            <button class="back-btn" onclick="backToCart()">← Back to Cart</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let currentOrderId = null;
        let pollingInterval = null;
        
        // Sample cart items
        const cart = [
            { name: 'Coffee', price: 5.50, quantity: 2 },
            { name: 'Sandwich', price: 12.00, quantity: 1 },
            { name: 'Cake', price: 8.00, quantity: 1 }
        ];
        
        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">RM ${item.price.toFixed(2)} each</div>
                    </div>
                    <div class="item-controls">
                        <div class="qty-control">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                            <span class="qty">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <div class="item-total">RM ${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                </div>
            `).join('');
            
            updateTotals();
        }
        
        function changeQty(index, delta) {
            cart[index].quantity = Math.max(1, cart[index].quantity + delta);
            renderCart();
        }
        
        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.06;
            const total = subtotal + tax;
            
            document.getElementById('subtotal').textContent = `RM ${subtotal.toFixed(2)}`;
            document.getElementById('tax').textContent = `RM ${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `RM ${total.toFixed(2)}`;
        }
        
        async function proceedToPayment() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = subtotal * 1.06;
            
            // Switch screens
            document.getElementById('cartScreen').classList.add('hidden');
            document.getElementById('paymentScreen').classList.add('active');
            
            // Show order summary
            const orderSummaryDiv = document.getElementById('orderSummary');
            orderSummaryDiv.innerHTML = `
                <h3>Order Summary</h3>
                ${cart.map(item => `
                    <div class="order-item">
                        <span>${item.quantity}x ${item.name}</span>
                        <span>RM ${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                `).join('')}
            `;
            
            document.getElementById('paymentAmount').textContent = `RM ${total.toFixed(2)}`;
            
            // Automatically create order and generate QR
            await createOrder(total);
        }
        
        async function createOrder(amount) {
            try {
                document.getElementById('loader').style.display = 'block';
                
                const response = await fetch(`${API_URL}/api/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });
                
                if (!response.ok) throw new Error('Failed to create order');
                
                const data = await response.json();
                currentOrderId = data.orderId;
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('qrContainer').style.display = 'block';
                document.getElementById('qrImage').src = data.qr;
                document.getElementById('orderId').textContent = data.orderId;
                
                showStatus('⏳ WAITING FOR PAYMENT', 'waiting');
                document.getElementById('simulateBtn').style.display = 'block';
                
                startPolling();
                
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert('Error: ' + error.message + '\n\nMake sure backend is running on ' + API_URL);
            }
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }
        
        async function startPolling() {
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/api/order/${currentOrderId}`);
                    const data = await response.json();
                    
                    if (data.status === 'PAID') {
                        showStatus('✅ PAYMENT SUCCESSFUL', 'paid');
                        stopPolling();
                        document.getElementById('simulateBtn').style.display = 'none';
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 3000);
        }
        
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }
        
        async function simulatePayment() {
            try {
                const response = await fetch(`${API_URL}/api/simulate-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: currentOrderId })
                });
                
                if (response.ok) {
                    showStatus('🎭 Payment simulation triggered... (7s)', 'waiting');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function backToCart() {
            stopPolling();
            currentOrderId = null;
            document.getElementById('cartScreen').classList.remove('hidden');
            document.getElementById('paymentScreen').classList.remove('active');
            document.getElementById('qrContainer').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            document.getElementById('simulateBtn').style.display = 'none';
        }
        
        // Initialize cart on load
        renderCart();
    </script>
</body>
</html>
